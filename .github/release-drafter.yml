---
name-template: "Release $RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Each category adds a patch bump, unless it sets "semver-increment".
# PRs without a matching label also give a patch bump.
categories:
  - type: "pre-exclude"
    when:
      label: "skip-changelog"
  - title: "🚀 New Features"
    semver-increment: "minor"
    when:
      label: "feature"
  - title: "🐛 Bug Fixes"
    when:
      labels:
        - "bug"
        - "bugfix"
        - "fix"
  - title: "📦 Dependency Updates"
    when:
      label: "docker"
  - title: "🛠️ Maintenance & CI"
    when:
      label: "ci"
  - title: "📖 Documentation"
    when:
      label: "documentation"
  - title: "⚠️ Breaking Changes"
    semver-increment: "major"
    when:
      label: "breaking-change"
  - type: "version-resolver"
    semver-increment: "patch"

# Used by the Autolabeler job in .github/workflows/release-drafter.yml.
autolabeler:
  - label: "ci"
    files:
      - ".github/**"
  - label: "docker"
    files:
      - "**/Dockerfile"
      - "build.yaml"
    branch:
      - "/^chore\\/.+/"
  - label: "documentation"
    files:
      - "*.md"
      - "docs/**"
  - label: "feature"
    branch:
      - "/^feature\\/.+/"
  - label: "bug"
    branch:
      - "/^(bug)?fix\\/.+/"

template: |
  ## What's Changed
  $CHANGES
  **Full Changelog**: $PREVIOUS_TAG...v$RESOLVED_VERSION
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
sort-by: merged_at
sort-direction: descending
